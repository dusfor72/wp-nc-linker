# Mirrors the target installation.

# PHP may only access the WordPress tree, the temp directory and the CA store (web requests only;
# WP-CLI runs without open_basedir).
<Directory /var/www/html>
	php_admin_value open_basedir "/var/www/html/:/tmp/:/etc/ssl/certs/"
</Directory>

# Direct calls of PHP files below wp-content are blocked; everything must go through WordPress.
<Directory /var/www/html/wp-content>
	<FilesMatch "\.php$">
		Require all denied
	</FilesMatch>
</Directory>

# Development only: the repository is mounted as the plugin directory; never serve dev/ (generated secrets).
<Directory /var/www/html/wp-content/plugins/wp-nc-linker/dev>
	Require all denied
</Directory>
