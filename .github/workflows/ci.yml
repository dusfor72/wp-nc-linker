name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHPCS and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  php-unit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite unit

  js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js

  package:
    name: Translations and plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Translation files are up to date
        run: |
          dev/bin/i18n.sh
          git diff --exit-code -I'Creation-Date' -I'Revision-Date' -- languages/*.pot languages/*.po languages/*.json
      - name: Build zip
        run: dev/bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-nc-linker-zip
          path: dist/*.zip
          retention-days: 14

  integration:
    name: Integration and E2E tests (WordPress + Nextcloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - name: Start and seed the test environment
        run: dev/bin/setup.sh
      - name: Run integration tests
        run: dev/bin/test-integration.sh
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: dev/bin/test-e2e.sh
      - name: No PHP notices, warnings or deprecations in the WordPress log
        run: |
          set -euo pipefail
          messages="$(docker compose --project-directory dev -f dev/docker-compose.yml logs wordpress 2>&1 | grep -iE 'php (warning|notice|deprecated|fatal)' || true)"
          if [ -n "$messages" ]; then
            echo "$messages"
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker compose --project-directory dev -f dev/docker-compose.yml logs --tail=200
      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
