name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' wp-nc-linker.php)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Compile translations
        run: |
          wp i18n make-mo languages
          wp i18n make-json languages --no-purge
      - name: Build zip
        run: dev/bin/build-zip.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
